name: Warframe Rotation Tracker

on:
  schedule:
    # Check 5 minutes after every hour. GitHub Actions schedules use UTC.
   - cron: "7,22,37,52 * * * *"
   
workflow_dispatch:
  inputs:
    only:
      description: "Which tracker should run?"
      required: true
      default: "all"
      type: choice
      options:
        - all
        - coda
        - bird3
        - archon

permissions:
  contents: write

concurrency:
  group: warframe-rotation-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
name: Run tracker
env:
    DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    INPUT_ONLY: ${{ inputs.only }}
shell: bash
 run: |
    ONLY="${INPUT_ONLY:-all}"
    python tracker.py --only "$ONLY"

      - name: Save tracker state
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update Warframe tracker state"
          git push
