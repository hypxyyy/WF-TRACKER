name: Pazuul

on:
  schedule:
    # Automatic check every 15 minutes. GitHub Actions schedules use UTC.
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:
    inputs:
      only:
        description: "Which tracker should run?"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - coda
          - bird3
          - archon
          - baro
          - darvo
          - teshin
          - incarnon
          - nightwave

      force:
        description: "Post it even if it has already been posted?"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: warframe-rotation-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tracker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_FORCE: ${{ inputs.force }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          ONLY="${INPUT_ONLY:-all}"

          # Scheduled runs NEVER force-post. Force is allowed only when you
          # manually click Run workflow in GitHub Actions.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_FORCE" == "true" ]]; then
            python tracker.py --only "$ONLY" --force
          else
            python tracker.py --only "$ONLY"
          fi

      - name: Save tracker state
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update Warframe tracker state"
          git push
